<text x="16" y="34" fill="#e8e6e3">Lines of constant g = ν<tspan dy="4" font-size="11">seen</tspan><tspan dy="-4"> / ν</tspan><tspan dy="4" font-size="11">emitted</tspan><tspan dy="-4"> on the direct image of the disk</tspan></text>
<text x="16" y="56" font-size="13" fill="#b3b0ab">Camera at 30 M, 12° above the disk, 60° field of view (the page's opening view): a camera image, not r and phi</text>
<text x="16" y="150" fill="#56b4e9">approaching side:</text>
<text x="16" y="170" font-size="13" fill="#b3b0ab">moves towards the camera,</text>
<text x="16" y="188" font-size="13" fill="#b3b0ab">blueshifted (g &gt; 1)</text>
<text x="944" y="150" fill="#e69f00" text-anchor="end">receding side:</text>
<text x="944" y="170" font-size="13" fill="#b3b0ab" text-anchor="end">moves away from the camera,</text>
<text x="944" y="188" font-size="13" fill="#b3b0ab" text-anchor="end">redshifted (g &lt; 1)</text>
<line x1="16" y1="447" x2="46" y2="447" stroke="#56b4e9" stroke-width="1.5"/>
<text x="54" y="452" font-size="13" fill="#56b4e9">g &gt; 1</text>
<line x1="16" y1="467" x2="46" y2="467" stroke="#e8e6e3" stroke-width="2"/>
<text x="54" y="472" font-size="13" fill="#e8e6e3">g = 1</text>
<line x1="16" y1="487" x2="46" y2="487" stroke="#e69f00" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="54" y="492" font-size="13" fill="#e69f00">g &lt; 1</text>
<rect x="0" y="506" width="960" height="34" fill="#101217"/>
<line x1="0" y1="506.5" x2="960" y2="506.5" stroke="#2c3038" stroke-width="1"/>
<text x="16" y="527" font-size="13" fill="#b3b0ab">On this image g runs from 0.493 to 1.430. Brightness summed over all frequencies scales as g⁴, which differs by a factor of 71 between them.</text>
