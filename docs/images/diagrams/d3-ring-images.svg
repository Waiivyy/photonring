<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
<title id="title">Ring images of the disk inner edge, and why they nest</title>
<desc id="desc">Left: side view of three rays from a distant observer above a face-on disk; they reach the inner edge r = 6 M after crossing the disk plane once, twice and three times (images n = 0, 1 and 2). Right: the image circles, and their distances from the shadow edge on a logarithmic scale, which shrink by 6.15, 23.89 and 23.22 from one image to the next; exp(pi) = 23.14.</desc>
<rect width="960" height="540" fill="#101217"/>
<g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15">
<text x="16" y="36" fill="#e8e6e3">Side view: observer far above (r<tspan dy="4" font-size="11">o</tspan><tspan dy="-4"> = 10⁴ M), looking down</tspan></text>
<line x1="0" y1="282" x2="141" y2="282" stroke="#f3d9a4" stroke-width="4"/>
<line x1="429" y1="282" x2="580" y2="282" stroke="#f3d9a4" stroke-width="4"/>
<circle cx="285" cy="282" r="72" fill="none" stroke="#f0e442" stroke-width="1.5" stroke-dasharray="6 3"/>
<circle cx="285" cy="282" r="48" fill="#000000" stroke="#cc79a7" stroke-width="1.5" stroke-dasharray="2 3"/>
<path d="M409.1 52L408.3 119.9 406.7 167.5 404.1 204.8 402.4 220.5 400.3 235 397.6 249.3 394.5 262.2 390.9 274.3 386.7 285.6 381.9 296.2 376.6 306.1 370.7 315.2 364.2 323.6 354.7 333.6 344.4 342.1 333.2 349 321.4 354.4 309.1 357.9 296.6 359.7 284 359.7 271.6 357.8 259.6 354 248.5 348.5 238.3 341.4 229.3 332.6 222 322.8 216.2 311.8 212.2 300 210.2 287.9 209.9 279.5 210.5 271.1 212.1 262.8 214.5 254.7 217.7 246.8 221.8 239.4 226.7 232.3 232.2 225.9 238.4 220.1 245.2 214.8 252.5 210.3 260.4 206.5 268.6 203.4 277.1 201.1 285.9 199.7 294.9 199 303.3 199.1 311.7 199.9 320.1 201.4 328.5 203.6 337 206.4 345.4 209.9 353.7 214 362.1 218.9 370.2 224.2 378.4 230.3 394.6 244.2 411.3 261.4 429 282" fill="none" stroke="#d55e00" stroke-width="2" stroke-dasharray="3 3" stroke-linejoin="round"/>
<path d="M415.5 52L414.4 126.5 412.3 178 410.7 199.1 408.7 218.1 406.3 235.1 403.3 250.9 399.5 266.2 395 280.6 389.8 293.7 383.8 305.9 377.1 317.2 369.5 327.6 361.1 337.2 352 345.6 340.5 354.1 328 361.2 314.9 366.5 301.2 370.2 287.1 372.1 273 372.2 258.7 370.6 244.4 367.2 231 362.3 217.6 355.8 204.5 347.7 191.7 338 179.1 326.8 166.8 314 154.1 299.2 141 282" fill="none" stroke="#e69f00" stroke-width="2" stroke-dasharray="8 4" stroke-linejoin="round"/>
<path d="M449.8 52L449 97.3 447.8 134.9 446.2 166.7 444.2 194.1 441.5 219 438.1 241.8 433.9 262.7 429 282" fill="none" stroke="#c9cdd3" stroke-width="2" stroke-linejoin="round"/>
<circle cx="394.5" cy="282" r="4" fill="#101217" stroke="#e69f00" stroke-width="1.5"/>
<circle cx="388.1" cy="282" r="4" fill="#101217" stroke="#d55e00" stroke-width="1.5"/>
<circle cx="209.9" cy="282" r="4" fill="#101217" stroke="#d55e00" stroke-width="1.5"/>
<circle cx="141" cy="282" r="5" fill="#009e73"/>
<circle cx="429" cy="282" r="5" fill="#009e73"/>
<text x="16" y="270" font-size="14" fill="#f3d9a4">disk, seen edge-on</text>
<text x="458.3" y="124" fill="#c9cdd3" stroke="#101217" stroke-width="4" stroke-linejoin="round" paint-order="stroke">n = 0</text>
<text x="279" y="394.4" fill="#e69f00" text-anchor="middle" stroke="#101217" stroke-width="4" stroke-linejoin="round" paint-order="stroke">n = 1</text>
<text x="297.6" y="189" fill="#d55e00" text-anchor="middle" stroke="#101217" stroke-width="4" stroke-linejoin="round" paint-order="stroke">n = 2</text>
<text x="16" y="448" font-size="13" fill="#b3b0ab">Filled dots: the disk's inner edge, r = 6 M (ISCO). Open dots: earlier</text>
<text x="16" y="467" font-size="13" fill="#b3b0ab">crossings of the disk plane, at r = 4.56 M (n = 1),</text>
<text x="16" y="486" font-size="13" fill="#b3b0ab">4.30 M and 3.13 M (n = 2): inside 6 M, where there is no disk.</text>
<line x1="588" y1="24" x2="588" y2="490" stroke="#2c3038" stroke-width="1"/>
<text x="604" y="36" fill="#e8e6e3">What the observer sees (images of r = 6 M)</text>
