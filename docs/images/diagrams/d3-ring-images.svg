<circle cx="700" cy="166" r="72.9" fill="none" stroke="#d55e00" stroke-width="2" stroke-dasharray="3 3"/>
<circle cx="700" cy="166" r="72.7" fill="none" stroke="#56b4e9" stroke-width="1.5"/>
<text x="700" y="171" font-size="13" fill="#b3b0ab" text-anchor="middle">shadow</text>
<line x1="818" y1="91" x2="848" y2="91" stroke="#c9cdd3" stroke-width="2"/>
<text x="856" y="96" font-size="14" fill="#c9cdd3">n = 0</text>
<line x1="818" y1="115" x2="848" y2="115" stroke="#e69f00" stroke-width="2" stroke-dasharray="8 4"/>
<text x="856" y="120" font-size="14" fill="#e69f00">n = 1</text>
<line x1="818" y1="139" x2="848" y2="139" stroke="#d55e00" stroke-width="2" stroke-dasharray="3 3"/>
<text x="856" y="144" font-size="14" fill="#d55e00">n = 2</text>
<line x1="818" y1="163" x2="848" y2="163" stroke="#56b4e9" stroke-width="1.5"/>
<text x="856" y="168" font-size="14" fill="#56b4e9">edge, b<tspan dy="4" font-size="11">c</tspan></text>
<text x="604" y="290" font-size="13" fill="#b3b0ab">To scale (1 M = 14 px): n = 1 lies 0.28 M outside the</text>
<text x="604" y="308" font-size="13" fill="#b3b0ab">edge and n = 2 only 0.012 M, so they merge with it here.</text>
<line x1="608" y1="392" x2="940" y2="392" stroke="#b3b0ab" stroke-width="1"/>
<line x1="614" y1="392" x2="614" y2="398" stroke="#b3b0ab" stroke-width="1"/>
<text x="614" y="414" font-size="13" fill="#b3b0ab" text-anchor="middle">1</text>
<line x1="684" y1="392" x2="684" y2="398" stroke="#b3b0ab" stroke-width="1"/>
<text x="684" y="414" font-size="13" fill="#b3b0ab" text-anchor="middle">10⁻¹</text>
<line x1="754" y1="392" x2="754" y2="398" stroke="#b3b0ab" stroke-width="1"/>
<text x="754" y="414" font-size="13" fill="#b3b0ab" text-anchor="middle">10⁻²</text>
<line x1="824" y1="392" x2="824" y2="398" stroke="#b3b0ab" stroke-width="1"/>
<text x="824" y="414" font-size="13" fill="#b3b0ab" text-anchor="middle">10⁻³</text>
<line x1="894" y1="392" x2="894" y2="398" stroke="#b3b0ab" stroke-width="1"/>
<text x="894" y="414" font-size="13" fill="#b3b0ab" text-anchor="middle">10⁻⁴</text>
<circle cx="647.3" cy="392" r="4.5" fill="#c9cdd3"/>
<text x="647.3" y="380" font-size="13" fill="#c9cdd3" text-anchor="middle">n = 0</text>
<circle cx="702.5" cy="392" r="4.5" fill="#e69f00"/>
<text x="702.5" y="380" font-size="13" fill="#e69f00" text-anchor="middle">n = 1</text>
<circle cx="799" cy="392" r="4.5" fill="#d55e00"/>
<text x="799" y="380" font-size="13" fill="#d55e00" text-anchor="middle">n = 2</text>
<circle cx="894.6" cy="392" r="4.5" fill="#e8e6e3"/>
<text x="894.6" y="380" font-size="13" fill="#e8e6e3" text-anchor="middle">n = 3</text>
<path d="M649.3 364L649.3 358L700.5 358L700.5 364" fill="none" stroke="#b3b0ab" stroke-width="1" stroke-linejoin="round"/>
<text x="674.9" y="352" font-size="13" fill="#e8e6e3" text-anchor="middle">÷ 6.15</text>
<path d="M704.5 364L704.5 358L797 358L797 364" fill="none" stroke="#b3b0ab" stroke-width="1" stroke-linejoin="round"/>
<text x="750.8" y="352" font-size="13" fill="#e8e6e3" text-anchor="middle">÷ 23.89</text>
<path d="M801 364L801 358L892.6 358L892.6 364" fill="none" stroke="#b3b0ab" stroke-width="1" stroke-linejoin="round"/>
<text x="846.8" y="352" font-size="13" fill="#e8e6e3" text-anchor="middle">÷ 23.22</text>
<text x="608" y="438" font-size="13" fill="#b3b0ab">b/b<tspan dy="4" font-size="10">c</tspan><tspan dy="-4"> − 1: distance from the shadow edge, logarithmic</tspan></text>
<text x="608" y="460" font-size="13" fill="#e8e6e3">Each extra half-turn: about exp(π) = 23.14 times closer.</text>
<rect x="0" y="506" width="960" height="34" fill="#101217"/>
<line x1="0" y1="506.5" x2="960" y2="506.5" stroke="#2c3038" stroke-width="1"/>
<text x="16" y="527" font-size="13" fill="#b3b0ab">Drawn in r and phi as flat polar coordinates; lengths and angles on the page are not what a local observer measures.</text>
<text x="944" y="527" font-size="13" fill="#b3b0ab" text-anchor="end">side view 1 M = 24 px</text>
</g>
</svg>
