<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
<title id="title">Light paths around a non-rotating black hole</title>
<desc id="desc">Rays arriving from the left with impact parameters from 0.4 to 1.7 times the critical value b_c. Rays below b_c fall through the photon sphere into the horizon; the ray at b_c circles the photon sphere; rays above it are bent and escape. The ray at 1.7 b_c is bent by 41.3 degrees, where the weak-field estimate gives 25.9.</desc>
