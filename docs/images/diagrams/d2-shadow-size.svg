<path d="M40 262L106.9 223.4 156.3 196.6 177.1 186.1 196.1 177.3 213.6 169.8 230.1 163.6 246.6 158.3 262.5 154.1 277.9 151.2 292.8 149.4 307.3 148.7 321.2 149.2 334.8 150.9 347.9 153.8 356.7 156.5 365.2 159.8 373.2 163.5 380.9 167.8 388.1 172.5 395 177.8 401.4 183.5 407.3 189.6 412.7 196.2 417.5 203.1 421.8 210.3 425.4 218 428.4 225.7 430.8 233.8 432.5 241.7 433.5 250 433.8 258.3 433.4 266.7 432.4 274.9 430.5 283 428.1 290.8 424.9 298.6 421.1 305.9 416.7 312.9 411.8 319.4 406.2 325.5 400.1 331.1 393.6 336.1 386.7 340.5 379.4 344.3 371.8 347.4 364 349.8 353.6 351.9 343.1 352.7 332.6 352.4 322.2 350.9 312.1 348.1 302.3 344.3 293.1 339.3 284.5 333.3 276.6 326.4 269.6 318.6 263.6 310 258.6 300.9 254.6 291.2 251.8 281.1 250.3 270.7 249.9 260.1 250.7 249.7 252.7 239.5 256 229.5 260.4 219.9 265.8 210.9 272.2 202.7 279.5 195.2 287.8 188.6 296.7 183.1 306.1 178.6 316 175.2 326.4 173 336.8 172 347.4 172.3 357.7 173.7 368 176.4" fill="none" stroke="#56b4e9" stroke-width="2" stroke-linejoin="round"/>
<circle cx="340" cy="262" r="90" fill="none" stroke="#f0e442" stroke-width="1.5" stroke-dasharray="6 3"/>
<circle cx="340" cy="262" r="60" fill="#000000" stroke="#cc79a7" stroke-width="1.5" stroke-dasharray="2 3"/>
<path d="M84 262A44 44 0 0 0 77.9 239.7" fill="none" stroke="#b3b0ab" stroke-width="1" stroke-linejoin="round"/>
<circle cx="40" cy="262" r="4" fill="#e8e6e3"/>
<text x="34" y="288" fill="#e8e6e3">observer, r<tspan dy="4" font-size="11">o</tspan><tspan dy="-4"> = 10 M</tspan></text>
<text x="34" y="308" font-size="13" fill="#b3b0ab">angle drawn here: 30.41°, not ψ<tspan dy="4" font-size="10">sh</tspan></text>
<line x1="16" y1="443" x2="46" y2="443" stroke="#56b4e9" stroke-width="2"/>
<text x="54" y="448" font-size="14" fill="#56b4e9">ψ = ψ<tspan dy="4" font-size="11">sh</tspan><tspan dy="-4">: the edge ray, winds onto r = 3M</tspan></text>
<line x1="16" y1="465" x2="46" y2="465" stroke="#e69f00" stroke-width="1.5" stroke-dasharray="5 3"/>
<text x="54" y="470" font-size="14" fill="#e69f00">ψ<tspan dy="4" font-size="11">sh</tspan><tspan dy="-4"> − 2°: falls in</tspan></text>
<line x1="16" y1="487" x2="46" y2="487" stroke="#c9cdd3" stroke-width="1.5"/>
<text x="54" y="492" font-size="14" fill="#c9cdd3">ψ<tspan dy="4" font-size="11">sh</tspan><tspan dy="-4"> + 2°: escapes</tspan></text>
<line x1="588" y1="24" x2="588" y2="490" stroke="#2c3038" stroke-width="1"/>
<text x="604" y="52" fill="#e8e6e3">In the observer's own frame</text>
<text x="604" y="72" font-size="13" fill="#b3b0ab">(angles in this panel are true)</text>
<text x="604" y="104" fill="#e8e6e3">sin ψ = (L/r<tspan dy="4" font-size="11">o</tspan><tspan dy="-4">) / (E/√(1 − 2M/r</tspan><tspan dy="4" font-size="11">o</tspan><tspan dy="-4">))</tspan></text>
<text x="638" y="128" fill="#e8e6e3">= (b/r<tspan dy="4" font-size="11">o</tspan><tspan dy="-4">) √(1 − 2M/r</tspan><tspan dy="4" font-size="11">o</tspan><tspan dy="-4">)</tspan></text>
<line x1="874.1" y1="336" x2="944" y2="336" stroke="#b3b0ab" stroke-width="1" stroke-dasharray="2 4"/>
<line x1="612" y1="336" x2="874.1" y2="336" stroke="#e8e6e3" stroke-width="1.5"/>
<line x1="874.1" y1="336" x2="874.1" y2="198.4" stroke="#e8e6e3" stroke-width="1.5"/>
<line x1="612" y1="336" x2="874.1" y2="198.4" stroke="#56b4e9" stroke-width="2.5"/>
<path d="M864.1 336L864.1 326L874.1 326" fill="none" stroke="#b3b0ab" stroke-width="1" stroke-linejoin="round"/>
<path d="M670 336A58 58 0 0 0 663.4 309" fill="none" stroke="#b3b0ab" stroke-width="1" stroke-linejoin="round"/>
<text x="678" y="326" fill="#e8e6e3">ψ<tspan dy="4" font-size="11">sh</tspan></text>
<text x="884.1" y="272.2" fill="#e8e6e3">L / r<tspan dy="4" font-size="11">o</tspan></text>
<text x="744" y="244" fill="#56b4e9" text-anchor="end">E / √(1 − 2M/r<tspan dy="4" font-size="11">o</tspan><tspan dy="-4">)</tspan></text>
<text x="612" y="358" font-size="13" fill="#b3b0ab">towards the hole (local radial direction)</text>
<text x="604" y="410" fill="#e8e6e3">Edge, b = b<tspan dy="4" font-size="11">c</tspan><tspan dy="-4">: ψ</tspan><tspan dy="4" font-size="11">sh</tspan><tspan dy="-4"> = 27.69° at r</tspan><tspan dy="4" font-size="11">o</tspan><tspan dy="-4"> = 10 M</tspan></text>
<text x="604" y="434" font-size="13" fill="#b3b0ab">Straight lines (sin ψ = b<tspan dy="4" font-size="10">c</tspan><tspan dy="-4">/r</tspan><tspan dy="4" font-size="10">o</tspan><tspan dy="-4">) would give 31.31°.</tspan></text>
<rect x="0" y="506" width="960" height="34" fill="#101217"/>
<line x1="0" y1="506.5" x2="960" y2="506.5" stroke="#2c3038" stroke-width="1"/>
<text x="16" y="527" font-size="13" fill="#b3b0ab">Drawn in r and phi as flat polar coordinates; lengths and angles on the page are not what a local observer measures.</text>
<text x="944" y="527" font-size="13" fill="#b3b0ab" text-anchor="end">left 1 M = 30 px</text>
</g>
</svg>
