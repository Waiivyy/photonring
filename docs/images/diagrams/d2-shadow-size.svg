<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc">
<title id="title">Why the shadow has the size it has</title>
<desc id="desc">Left: from an observer at 10 M, the ray at the shadow edge winds onto the photon sphere; rays 2 degrees inside fall in and 2 degrees outside escape. Right: the photon's momentum in the observer's own frame, where sin psi = (b/r_o) sqrt(1 - 2M/r_o); at the edge psi_sh = 27.69 degrees, against 31.31 for straight lines.</desc>
