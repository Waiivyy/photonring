name: Deploy to GitHub Pages

# Started by hand only: Actions > Deploy to GitHub Pages > Run workflow (branch main),
# or gh workflow run pages.yml --ref main. Never add a push, schedule or other trigger.
# Deploy only a commit whose CI run is green in all three jobs.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Check, build and test the page
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      PHOTONRING_ADAPTER: swiftshader
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No npm cache in the deploy workflow: it would be a path into the published build.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run check
      # The webServer of this test runs npm run build (type check, vite build, dist rules), so the
      # dist/ uploaded below is the build this test has just checked.
      - name: Build, then check for requests beyond same-origin files (item 15)
        run: npx playwright test -c playwright.dist.config.ts --output test-results/dist
      - name: Keep the test results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-test-results
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
